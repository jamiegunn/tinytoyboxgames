name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build game + docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        working-directory: src
        run: bun install --frozen-lockfile

      # base must match the Pages sub-path so the game's assets resolve at
      # https://jamiegunn.github.io/tinytoyboxgames/game/
      - name: Build game
        working-directory: src
        run: bunx vite build --base=/tinytoyboxgames/game/

      - name: Assemble Pages site (game + rendered docs + landing)
        run: |
          mkdir -p _site
          cp -r src/dist _site/game
          npm install marked@^12 --no-save
          node scripts/build-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

# One workflow, deliberately.
#
# Until 2026-08-01 this file and a separate `deploy-pages.yml` both triggered on
# `push: [main]` with nothing connecting them. The deploy workflow's `needs:`
# was an internal job dependency — deploy waiting on its own build — not a
# dependency on the quality gates over here. So the two raced: a push whose test
# suite went red still published to GitHub Pages, and the red X landed next to a
# commit that was already live. Every contract test in this repo sat in a
# workflow with no authority over what reached players.
#
# Merging them makes `needs: quality` mean what it looks like it means.
#
# NOTE ON THE TWO BUILDS. The site build is NOT a duplicate of the quality
# build. `vite.config.ts` sets `base: '/'`, which is what the Docker image
# serves; the Pages site lives under a sub-path and needs a matching `--base` or
# every asset URL 404s. They are two different artifacts from one commit, so
# both are built on purpose.
#
# THE SUB-PATH IS `/game/`, NOT `/tinytoyboxgames/game/`, AND THAT COST A
# DEPLOY. This workflow built with `--base=/tinytoyboxgames/game/`, which is
# correct for a project page at `jamiegunn.github.io/tinytoyboxgames/`. The site
# has a CUSTOM DOMAIN, and a custom domain serves the repo from the DOMAIN ROOT:
# GitHub itself proves it by redirecting
#
#     jamiegunn.github.io/tinytoyboxgames/game/  ->  tinytoyboxgames.com/game
#
# with the repo prefix stripped. So every bundle was requested from
# tinytoyboxgames.com/tinytoyboxgames/game/assets/... — a 404 — and the page
# served, mounted nothing, and rendered a blank white screen.
#
# The validation step below did not catch it. It grepped for the very string the
# build had just been told to write, so it asserted that the build did what it
# was asked rather than that the result works at the URL it is served from. A
# check whose expected value is copied from the input is not a check. Both now
# read PAGES_BASE, and `tests/framework/ciWorkflow.test.mjs` fails if they ever
# stop agreeing or if the base stops matching the CNAME.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top; the deploy job widens its own.
permissions:
  contents: read

env:
  # The one place the deployed sub-path is written down. The build, the CNAME
  # and the validation all read it, so they cannot disagree with each other.
  PAGES_BASE: /
  PAGES_DOMAIN: tinytoyboxgames.com

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Keyed on the lockfile: a dependency change busts it, nothing else does.
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -b

      - name: Typecheck probe harness
        # tsc -b cannot reach it: src/tsconfig.json references only the app and
        # node projects, so the harness that grades every review round is the one
        # body of code nothing type-checks. The pre-commit gate runs this; CI did not.
        run: bunx tsc -p .probe/tsconfig.probe.json --noEmit

      - name: Lint
        run: bunx eslint . --max-warnings 0

      - name: Format check
        # check-code-quality.cjs lives at the repo root and was invoked by nothing —
        # not a script, not a hook, not a workflow — and had been red since at least
        # the 2026-07-18 review. A gate nobody runs is a comment.
        run: node ../check-code-quality.cjs

      - name: Contract tests
        # A directory list is an exclusion criterion doing unchecked work — see the
        # docblock in src/scripts/precommit-check.cjs, which makes the same argument
        # about the pre-commit hook. Until 2026-08-01 this line named five of the
        # eight test directories and CI therefore ran 145 of 429 tests; the 284 it
        # skipped included every architectural guard in tests/framework/.
        # tests/framework/ciWorkflow.test.mjs pins this. node expands the glob
        # itself — do not add a shell.
        run: node --test "tests/**/*.test.mjs"

      - name: Coverage ratchet
        # Gates on module-level coverage only: which modules any test loads is
        # deterministic, while covered-line counts are not (the code calls
        # Math.random()). See scripts/coverage-ratchet.mjs.
        run: node scripts/coverage-ratchet.mjs

      - name: Build
        run: bunx vite build

  pages:
    name: Assemble Pages site
    # THE GATE. Without this the deploy races the tests instead of following them.
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install game dependencies
        working-directory: src
        run: bun install --frozen-lockfile

      # base must match the path the site is SERVED from, which with a custom
      # domain is the domain root — see the note at the top of this file.
      - name: Build game
        working-directory: src
        run: bunx vite build --base="$PAGES_BASE"

      - name: Assemble Pages site (game at the root + rendered docs)
        run: |
          mkdir -p _site
          # `dist/.` not `dist`: the game IS the site now, so its contents go to
          # the root rather than into a `game/` subdirectory. The trailing `/.`
          # is what makes cp copy the contents instead of the directory.
          cp -r src/dist/. _site/
          npm install marked@^12 --no-save
          node scripts/build-pages.mjs
          # The custom domain has to be in the ARTIFACT. With an Actions deploy
          # the domain is not carried over from the previous publish, and a
          # missing CNAME is how a custom domain silently reverts to
          # <user>.github.io/<repo>/ — which would make the base above wrong
          # again, in the other direction.
          printf '%s\n' "$PAGES_DOMAIN" > _site/CNAME

      - name: Validate the assembled site
        # The Dockerfile validates its artifact before shipping it; the Pages
        # path shipped whatever landed in _site/. `vite build` exiting 0 is not
        # the same claim as "the page loads and references its bundles".
        run: |
          set -e
          echo "▸ game entry is the site root…" && test -f _site/index.html
          echo "▸ docs index exists…"          && test -f _site/docs/index.html
          echo "▸ JS bundle emitted…"          && ls _site/assets/*.js  >/dev/null
          echo "▸ CSS bundle emitted…"         && ls _site/assets/*.css >/dev/null
          echo "▸ game entry references JS…"   && grep -q '\.js'  _site/index.html
          echo "▸ game entry references CSS…"  && grep -q '\.css' _site/index.html
          # The root really is the APP and not the old marketing page, which also
          # lived at _site/index.html and also referenced a .css file. Both checks
          # above pass for it, so neither of them can tell the two apart.
          echo "▸ the root is the app, not a landing page…" && grep -q 'id="root"' _site/index.html
          echo "▸ CNAME pins the custom domain…"  && test "$(cat _site/CNAME)" = "$PAGES_DOMAIN"
          # `src="` included deliberately: bare "${PAGES_BASE}assets/" is the
          # substring "/assets/" once the base is "/", which a relative
          # "./assets/" also contains. Anchoring on the attribute makes the check
          # mean what it says.
          echo "▸ asset URLs carry the Pages base…" \
            && grep -q "src=\"${PAGES_BASE}assets/" _site/index.html
          # AND NOT THE REPO PREFIX. The grep above passes for any base the build
          # was told to use, including a wrong one — that is exactly how the
          # blank deploy shipped, at /tinytoyboxgames/game/. This asserts the
          # specific mistake is gone. Written as an explicit `if` rather than
          # `! grep`, because `set -e` ignores the status of a negated command
          # and the check would pass whatever it found.
          echo "▸ no repo-prefixed asset URLs…"
          if grep -q '/tinytoyboxgames/' _site/index.html; then
            echo "✖ assets are still built for the github.io project path. The site" >&2
            echo "  is served from a custom domain, which strips the repo prefix." >&2
            exit 1
          fi
          JS_SIZE=$(stat -c%s _site/assets/*.js | sort -rn | head -1)
          echo "▸ JS bundle is non-empty (>1 KB)…" && test "$JS_SIZE" -gt 1024
          echo "✔ site validated (main bundle: ${JS_SIZE} bytes)"

      # EVERY CHECK ABOVE IS A CHECK ON THE ARTIFACT. None of them loads it.
      # The blank deploy passed all of them, because the one that mattered
      # grepped for the string the build had just been told to write — its
      # expected value came from its own input. This step has an independent
      # oracle: serve _site exactly as Pages will, open it in a real browser and
      # require that #root has children, that nothing 404'd, and that nothing
      # threw. It reproduces the blank deploy as a failure, and it also catches
      # the case no grep can — a bundle that loads and then throws.
      - name: Smoke-test the assembled site in a browser
        run: |
          set -e
          npm install playwright@^1.48 --no-save
          npx playwright install --with-deps chromium
          npx --yes http-server _site -p 8099 --silent &
          for i in $(seq 1 30); do
            curl -sf "http://localhost:8099${PAGES_BASE}index.html" >/dev/null && break
            sleep 1
          done
          node scripts/smoke-site.mjs "http://localhost:8099${PAGES_BASE}"
          node scripts/smoke-site.mjs "http://localhost:8099/docs/"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job gets write access to Pages.
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; newer pushes cancel in-progress runs. Scoped to this
    # job so it cannot cancel a PR's quality run.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
